name: Train and publish high-recall MLP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/cardio_train.csv','train.py','model.py','preprocessing.py','requirements.txt','tests/**','.github/workflows/train-mlp.yml']
permissions:
  contents: write
concurrency:
  group: cardio-mlp-training
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: true}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate uploaded original dataset
        run: |
          test -f data/cardio_train.csv || (echo 'Upload your original dataset to data/cardio_train.csv first.' && exit 1)
          python - <<'PY'
          import pandas as pd
          df=pd.read_csv('data/cardio_train.csv',sep=';')
          required={'id','age','gender','height','weight','ap_hi','ap_lo','cholesterol','gluc','smoke','alco','active','cardio'}
          missing=required.difference(df.columns)
          if missing or len(df)<1000: raise SystemExit(f'Dataset validation failed: rows={len(df)}, missing={sorted(missing)}')
          if not set(df['cardio'].dropna().unique()).issubset({0,1}): raise SystemExit('Target cardio must contain only 0/1')
          print(f'Validated {len(df):,} rows and {len(df.columns)} columns')
          PY
      - name: Train MLP and create artifacts
        run: python train.py
      - name: Run tests
        run: pytest -q
      - name: Validate model artifacts
        run: |
          python - <<'PY'
          import json,torch
          from model import CardioMLP
          from pathlib import Path
          p=Path('artifacts'); r=json.loads((p/'metrics.json').read_text()); c=json.loads((p/'preprocessing.json').read_text())
          m=CardioMLP(c['input_dim']); m.load_state_dict(torch.load(p/'mlp_state_dict.pt',map_location='cpu',weights_only=True))
          assert r['default_operating_point']=='high_recall'
          assert (p/'training_history.csv').stat().st_size>0
          print(json.dumps(r['operating_points']['high_recall']['test'],indent=2))
          PY
      - name: Commit trained artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/mlp_state_dict.pt artifacts/preprocessing.json artifacts/metrics.json artifacts/training_history.csv
          if git diff --cached --quiet; then echo 'No artifact changes'; else
            git commit -m 'chore: publish freshly trained high-recall MLP artifacts [skip ci]'
            git push origin HEAD:main
          fi
