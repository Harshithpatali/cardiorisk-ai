name: Train and publish high-recall MLP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/cardio_train.csv"
      - "*.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/train-mlp.yml"

permissions:
  contents: write

concurrency:
  group: cardio-mlp-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Validate source dataset
        run: python validate_data.py

      - name: Train and evaluate modular pipeline
        run: python train.py

      - name: Run cross-validated benchmark and statistical audit
        run: python research_validation.py

      - name: Investigate specificity at matched recall
        run: python specificity_investigation.py

      - name: Run experimental MLP architecture benchmark
        run: python mlp_variant_benchmark.py

      - name: Build development-only MLP operating-point frontier
        run: python operating_point_analysis.py

      - name: Run automated tests
        run: python -m pytest -q

      - name: Validate saved artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch
          from model import CardioMLP

          artifact_dir = Path("artifacts")
          metrics = json.loads((artifact_dir / "metrics.json").read_text())
          config = json.loads((artifact_dir / "preprocessing.json").read_text())
          model = CardioMLP(config["input_dim"])
          weights = torch.load(
              artifact_dir / "mlp_state_dict.pt",
              map_location="cpu",
              weights_only=True,
          )
          model.load_state_dict(weights)
          assert metrics["default_operating_point"] == "high_recall"
          assert "cross_validation" in metrics
          assert len(metrics["cross_validation"]["folds"]) == 5
          assert "operating_points" in metrics
          assert "high_recall" in metrics["operating_points"]
          assert (artifact_dir / "training_history.csv").stat().st_size > 0
          research = json.loads((artifact_dir / "research_validation.json").read_text())
          assert len(research["models"]) == 4
          assert len(research["fold_results"]) == 20
          assert research["selected_benchmark_reference"] in research["models"]
          benchmark_oof = __import__("pandas").read_csv(artifact_dir / "benchmark_oof_predictions.csv")
          assert len(benchmark_oof) == research["development_rows"]
          specificity = json.loads((artifact_dir / "specificity_investigation.json").read_text())
          assert len(specificity["candidates"]) == 18
          assert (artifact_dir / "specificity_investigation.csv").stat().st_size > 0
          assert (artifact_dir / "specificity_oof_predictions.csv").stat().st_size > 0
          assert "deployed_mlp_oof_analysis" in research
          frontier = json.loads((artifact_dir / "mlp_operating_point_frontier.json").read_text())
          variants = json.loads((artifact_dir / "mlp_variant_benchmark.json").read_text())
          assert len(variants["variants"]) == 3
          assert (artifact_dir / "mlp_variant_benchmark.csv").stat().st_size > 0
          assert len(frontier["rows"]) == 5
          assert (artifact_dir / "mlp_operating_point_frontier.csv").stat().st_size > 0
          assert (artifact_dir / "mlp_oof_predictions.csv").stat().st_size > 0
          print(json.dumps(metrics["test"], indent=2))
          PY

      - name: Commit trained artifacts
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/mlp_state_dict.pt
          git add artifacts/preprocessing.json
          git add artifacts/metrics.json
          git add artifacts/training_history.csv
          git add artifacts/research_validation.json
          git add artifacts/benchmark_oof_predictions.csv
          git add artifacts/specificity_investigation.json
          git add artifacts/specificity_investigation.csv
          git add artifacts/specificity_oof_predictions.csv
          git add artifacts/benchmark_folds.csv
          git add artifacts/threshold_analysis.csv
          git add artifacts/mlp_oof_predictions.csv
          git add artifacts/mlp_operating_point_frontier.json
          git add artifacts/mlp_operating_point_frontier.csv
          git add artifacts/mlp_variant_benchmark.json
          git add artifacts/mlp_variant_benchmark.csv
          if git diff --cached --quiet; then
            echo "No artifact changes"
          else
            git commit -m "chore: publish cross-fitted MLP artifacts [skip ci]"
            git push origin HEAD:main
          fi
