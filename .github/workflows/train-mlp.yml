name: Train and publish high-recall MLP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/cardio_train.csv"
      - "*.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/train-mlp.yml"

permissions:
  contents: write

concurrency:
  group: cardio-mlp-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Validate source dataset
        run: python validate_data.py

      - name: Train and evaluate modular pipeline
        run: python train.py

      - name: Run automated tests
        run: pytest -q

      - name: Validate saved artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch
          from model import CardioMLP

          artifact_dir = Path("artifacts")
          metrics = json.loads((artifact_dir / "metrics.json").read_text())
          config = json.loads((artifact_dir / "preprocessing.json").read_text())
          model = CardioMLP(config["input_dim"])
          weights = torch.load(
              artifact_dir / "mlp_state_dict.pt",
              map_location="cpu",
              weights_only=True,
          )
          model.load_state_dict(weights)
          assert metrics["default_operating_point"] == "high_recall"
          assert "cross_validation" in metrics
          assert len(metrics["cross_validation"]["folds"]) == 5
          assert "operating_points" in metrics
          assert "high_recall" in metrics["operating_points"]
          assert (artifact_dir / "training_history.csv").stat().st_size > 0
          print(json.dumps(metrics["test"], indent=2))
          PY

      - name: Commit trained artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/mlp_state_dict.pt
          git add artifacts/preprocessing.json
          git add artifacts/metrics.json
          git add artifacts/training_history.csv
          if git diff --cached --quiet; then
            echo "No artifact changes"
          else
            git commit -m "chore: publish cross-fitted MLP artifacts [skip ci]"
            git push origin HEAD:main
          fi
